
       <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Business in a Box</title>
<style>
:root{--bg:#070914;--panel:#0e1220;--panel2:#13192a;--text:#f8fafc;--muted:#94a3b8;--line:#20283b;--accent:#8b5cf6;--accent2:#06b6d4;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top right,#18204a 0,#070914 42%);color:var(--text);min-height:100vh}
button,input{font:inherit}.app{display:flex;min-height:100vh}
.sidebar{width:245px;background:rgba(9,13,26,.9);border-right:1px solid var(--line);padding:24px 16px;position:fixed;inset:0 auto 0 0}
.logo{font-size:21px;font-weight:800;margin:4px 10px 35px}.logo b{color:#a78bfa}
.nav button{display:block;width:100%;background:none;border:0;color:var(--muted);text-align:left;padding:13px 14px;border-radius:10px;margin:5px 0;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);color:#fff}
.main{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1500px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{font-size:28px}.pill{font-size:12px;padding:8px 12px;border:1px solid #29334d;border-radius:99px;color:#c4b5fd;background:#11162a}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px}
.card{background:rgba(14,18,32,.86);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.card h2{font-size:18px;margin-bottom:7px}.muted{color:var(--muted);font-size:13px;line-height:1.5}
label{display:block;color:#cbd5e1;font-size:12px;margin:17px 0 7px}
input,select{width:100%;background:#080c18;border:1px solid #29344b;color:#fff;border-radius:9px;padding:12px;outline:none}input:focus,select:focus{border-color:var(--accent)}
.generate{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;color:#fff;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 30px rgba(99,102,241,.2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tool{border:1px solid #29344b;background:#101729;color:#dbeafe;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:12px}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:12px}.tab{white-space:nowrap;border:1px solid #29344b;background:#0c1220;color:#9ca3af;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:12px}.tab.active{background:#211a3b;color:#ddd6fe;border-color:#5b4a9a}
.output{min-height:520px;background:#0a0f1c;border:1px solid #202a40;border-radius:14px;padding:22px}
.heroDemo{background:linear-gradient(135deg,#171d36,#0e1322);border:1px solid #283452;border-radius:15px;padding:34px;text-align:center}.heroDemo .eyebrow{color:#a78bfa;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px}.heroDemo h3{font-size:32px;margin:10px 0}.heroDemo p{color:#aab5c8;max-width:650px;margin:auto;line-height:1.6}.cta{display:inline-block;margin-top:20px;padding:11px 18px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:800}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.mini{background:#111827;border:1px solid #222e45;padding:16px;border-radius:12px}.mini h4{margin-bottom:7px}.mini p,.mini li{color:#9aa7ba;font-size:12px;line-height:1.55}.mini ul{padding-left:16px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.copy{border:1px solid #303c55;background:#121a2b;color:#c4b5fd;padding:7px 9px;border-radius:7px;font-size:11px;cursor:pointer}
.item{background:#111827;border:1px solid #222e45;padding:14px;border-radius:11px;margin:9px 0}.item strong{display:block;margin-bottom:5px}.item span{color:#9aa7ba;font-size:12px;line-height:1.55}.status{display:none;margin-top:10px;color:#86efac;font-size:12px;text-align:center}
@media(max-width:900px){.sidebar{display:none}.main{margin:0;width:100%;padding:16px}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.top h1{font-size:22px}.heroDemo h3{font-size:25px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo">AI <b>Business</b> in a Box</div>
<div class="nav">
<button class="active">✦ Generator</button><button>◈ Projects</button><button>◎ Brand Kit</button><button>▣ Content</button><button>⚙ Settings</button>
</div>
</aside>
<main class="main">
<div class="top"><div><h1>AI Business in a Box</h1><p class="muted">Turn one business idea into a complete marketing starter kit.</p></div><div class="pill">● DEMO MODE</div></div>
<div class="grid">
<section class="card">
<h2>Create your business kit</h2><p class="muted">Enter your business and city to generate a professional preview.</p>
<label>Business</label><input id="business" placeholder="e.g. Nova Coffee">
<label>City</label><input id="city" placeholder="e.g. Lahore">
<label>Business Type</label><select id="type"><option>Restaurant</option><option>Agency</option><option>Online Store</option><option>Salon</option><option>Real Estate</option><option>Portfolio</option><option>Local Business</option></select>
<label>Theme</label><select id="theme"><option value="#8b5cf6">Premium Purple</option><option value="#2563eb">Ocean Blue</option><option value="#059669">Emerald</option><option value="#e11d48">Rose</option></select>
<button class="generate" onclick="generate()">✨ Generate Business Kit</button>
<div class="status" id="status">✓ Business kit generated</div>
</section>
<section class="card">
<div class="toolbar"><button class="tool" onclick="copyCurrent()">Copy Current</button><button class="tool" onclick="window.print()">Export / Print PDF</button></div>
<div class="tabs">
<button class="tab active" onclick="show('landing',this)">Landing Page</button><button class="tab" onclick="show('brand',this)">Brand Kit</button><button class="tab" onclick="show('content',this)">30 Days Content</button><button class="tab" onclick="show('whatsapp',this)">WhatsApp</button><button class="tab" onclick="show('ads',this)">Ad Creatives</button>
</div>
<div id="output" class="output"></div>
</section>
</div>
</main>
</div>
<script>
let current='landing', data={business:'Your Business',city:'Your City',type:'Local Business',theme:'#8b5cf6'};
const names=['Nova','Luma','Nexa','Viora','Aurex','Velora','Zentra','Mira','Orbia','Elevia'];
function generate(){
data.business=document.getElementById('business').value.trim()||'Your Business';
data.city=document.getElementById('city').value.trim()||'Your City';
data.type=document.getElementById('type').value;
data.theme=document.getElementById('theme').value;
document.documentElement.style.setProperty('--accent',data.theme);
document.getElementById('status').style.display='block';
render();
setTimeout(()=>document.getElementById('status').style.display='none',1800);
}
function render(){
const b=data.business,c=data.city,t=data.type,o=document.getElementById('output');
if(current==='landing')o.innerHTML=`<div class="heroDemo"><div class="eyebrow">${t} • ${c}</div><h3>Build a stronger brand with ${b}</h3><p>A premium, conversion-focused online experience designed for ${b} in ${c}. Turn visitors into customers with a clear message and modern design.</p><div class="cta">Get Started</div></div><div class="cards"><div class="mini"><h4>⚡ Fast Experience</h4><p>Clean, responsive and optimized for modern customers.</p></div><div class="mini"><h4>✦ Premium Brand</h4><p>Professional visuals and messaging that build trust.</p></div><div class="mini"><h4>📈 Conversion Ready</h4><p>Clear calls-to-action designed to generate enquiries.</p></div></div><div class="cards"><div class="mini"><h4>Pricing</h4><p>Starter — $49<br>Growth — $149<br>Premium — $299</p></div><div class="mini"><h4>FAQ</h4><p>How fast can we start?<br>What services are included?<br>Can the design be customized?</p></div><div class="mini"><h4>Why ${b}?</h4><p>Local, professional and focused on customer results.</p></div></div>`;
if(current==='brand')o.innerHTML=`<div class="row"><div><h2>Brand Kit</h2><p class="muted">Starter identity ideas for ${b}.</p></div><button class="copy" onclick="copyText()">Copy All</button></div><div class="cards"><div class="mini"><h4>10 Name Ideas</h4><ul>${names.map(n=>`<li>${n} ${b}</li>`).join('')}</ul></div><div class="mini"><h4>3 Logo Concepts</h4><p>① Monogram + modern wordmark<br>② Minimal icon + bold type<br>③ Premium badge + symbol</p></div><div class="mini"><h4>Brand Colors</h4><p>Primary: ${data.theme}<br>Dark: #0B1020<br>Light: #F8FAFC<br>Accent: #06B6D4</p></div></div><div class="item"><strong>Tagline</strong><span>“Make your ${t.toLowerCase()} brand impossible to ignore.”</span></div>`;
if(current==='content')o.innerHTML=`<h2>30 Days Content Plan</h2><p class="muted">Ready-to-edit social posts for ${b}.</p>`+Array.from({length:30},(_,i)=>`<div class="item"><div class="row"><strong>Day ${i+1} — ${['Educational','Promotional','Behind the Scenes','Customer Story','Tip of the Day'][i%5]}</strong><button class="copy" onclick="navigator.clipboard.writeText(this.parentElement.parentElement.innerText)">Copy</button></div><span>${b} in ${c}: discover a better way to experience ${t.toLowerCase()}. Message us today to learn more. #${b.replace(/\\s/g,'')} #${c.replace(/\\s/g,'')} #Business #LocalBusiness</span></div>`).join('');
if(current==='whatsapp')o.innerHTML=`<h2>WhatsApp Sales Scripts</h2><p class="muted">5 bilingual starter messages.</p>`+Array.from({length:5},(_,i)=>`<div class="item"><div class="row"><strong>Script ${i+1}</strong><button class="copy" onclick="navigator.clipboard.writeText(this.parentElement.parentElement.innerText)">Copy</button></div><span>English: Hi! We are ${b} in ${c}. We'd love to help you with our ${t.toLowerCase()} service. Can I share today's offer?<br><br>Urdu: السلام علیکم! ہم ${c} میں ${b} ہیں۔ ہم آپ کی ${t.toLowerCase()} کی ضرورت میں مدد کر سکتے ہیں۔ کیا میں آج کی آفر شیئر کروں؟</span></div>`).join('');
if(current==='ads')o.innerHTML=`<h2>Facebook Ad Creatives</h2><p class="muted">3 campaign-ready concepts and headlines.</p>`+['Grow Your Business Today','Premium Quality. Local Trust.','Your Next Customer Is Looking For You'].map((h,i)=>`<div class="item"><div class="row"><strong>Ad ${i+1}: ${h}</strong><button class="copy" onclick="navigator.clipboard.writeText(this.parentElement.parentElement.innerText)">Copy</button></div><span>Headline: ${h}<br>Primary Text: Looking for a trusted ${t.toLowerCase()} in ${c}? ${b} is ready to serve you with a professional experience. Contact us today and get started.</span></div>`).join('');
}
function show(x,el){current=x;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render()}
function copyCurrent(){navigator.clipboard?.writeText(document.getElementById('output').innerText);alert('Copied!')}
function copyText(){copyCurrent()}
generate();
</script>
</body>
</html>
